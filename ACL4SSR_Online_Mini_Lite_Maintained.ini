[custom]
; ACL4SSR Online Mini Lite Maintained
; Lite profile: no full ad block, no full direct/proxy domain databases.
; Unmatched traffic defaults to 🎯 全球直连 through the 🐟 漏网之鱼 group.
; Source repository: https://github.com/NOWYQS/ACL4SSR_Online_Mini_Maintained

; Local/private and China traffic
ruleset=🎯 全球直连,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/lite/private.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/lite/applications.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/lite/lancidr.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/lite/cncidr.list

; Focused proxy categories
ruleset=🚀 节点选择,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/lite/gfw.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/lite/tld-not-cn.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/lite/telegramcidr.list

ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 自动选择`.*

enable_rule_generator=true
overwrite_original_rules=true
