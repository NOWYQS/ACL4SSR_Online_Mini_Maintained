name: Update converted rules

on:
  schedule:
    # 11:17 Asia/Shanghai, after Loyalsoldier's daily release window.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-converted-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert upstream provider payloads
        run: python3 scripts/update_rules.py

      - name: Commit changed generated lists
        run: |
          if git diff --quiet -- generated; then
            echo "No upstream rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git commit -m "chore: update converted upstream rules"
          git push
