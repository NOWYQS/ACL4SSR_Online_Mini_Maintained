[custom]
; ACL4SSR Online Mini Maintained
; Generated rule lists are converted from Loyalsoldier/clash-rules provider payloads.
; The repository's GitHub Action refreshes them daily after the upstream release.
; Source repository: https://github.com/NOWYQS/ACL4SSR_Online_Mini_Maintained

; Local/private and China traffic
ruleset=🎯 全球直连,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/private.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/applications.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/direct.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/lancidr.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/cncidr.list

; Blocking
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/reject.list

; Proxy traffic
ruleset=🚀 节点选择,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/proxy.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/gfw.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/tld-not-cn.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/NOWYQS/ACL4SSR_Online_Mini_Maintained/main/generated/telegramcidr.list

ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`.*

enable_rule_generator=true
overwrite_original_rules=true
